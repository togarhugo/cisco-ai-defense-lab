<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabBot - AI Defense Lab</title>
<style>
  :root { --bg:#0f172a; --panel:#111827; --line:#1f2937; --text:#e5e7eb; --muted:#9ca3af;
          --user:#1d4ed8; --bot:#1f2937; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  .pill { font-size:12px; padding:2px 8px; border-radius:999px; background:var(--line); color:var(--muted); }
  .flow { font-size:12px; color:var(--muted); }
  .spacer { flex:1; }
  #routeWrap { display:none; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
  select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit; }
  select.direct { border-color:var(--warn); color:#fbbf24; }
  main { flex:1; display:flex; min-height:0; }
  #chat { flex:2; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  #log { flex:1; overflow-y:auto; padding:16px; border-left:1px solid var(--line); background:var(--panel); font-size:13px; }
  .msg { max-width:80%; padding:10px 12px; border-radius:10px; white-space:pre-wrap; line-height:1.4; overflow-wrap:anywhere; }
  .user { align-self:flex-end; background:var(--user); }
  .bot { align-self:flex-start; background:var(--bot); }
  .blocked { border:1px solid var(--bad); background:#3f1d1d; }
  .files { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .file { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); border-radius:8px; padding:4px 8px; font-size:12px; max-width:240px; }
  .file img { width:36px; height:36px; object-fit:cover; border-radius:4px; }
  .file span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file button { background:none; border:0; color:inherit; cursor:pointer; padding:0 2px; font-size:14px; }
  #composer { border-top:1px solid var(--line); padding:10px 16px; }
  #composer.drag { outline:2px dashed var(--user); outline-offset:-6px; }
  #pending { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  #row { display:flex; gap:8px; }
  textarea { flex:1; resize:none; height:60px; background:var(--panel); color:var(--text);
             border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
  button.act { background:var(--user); color:white; border:0; border-radius:8px; padding:0 16px; cursor:pointer; font:inherit; }
  button.secondary { background:var(--line); }
  #err { color:#fca5a5; font-size:13px; min-height:16px; margin-top:4px; overflow-wrap:anywhere; }
  #dropzone { display:none; position:fixed; inset:0; z-index:10; background:rgba(15,23,42,.85); border:3px dashed var(--user);
              align-items:center; justify-content:center; font-size:22px; pointer-events:none; text-align:center; padding:20px; }
  #dropzone.show { display:flex; }
  .notes { margin:2px 0 0 14px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .muted { color:var(--muted); }
  @media (max-width: 800px) { main { flex-direction:column; } #log { border-left:0; border-top:1px solid var(--line); max-height:35vh; } }
</style>
</head>
<body>
<div id="dropzone">Drop files to attach<br><small>images, PDF, Word / Excel / PowerPoint, zip / tar / gz, text and code</small></div>
<header>
  <h1>LabBot</h1>
  <span class="pill" id="ver">v?</span>
  <span class="pill" id="mode">AI Defense: ?</span>
  <span class="flow" id="flow"></span>
  <span class="spacer"></span>
  <label id="routeWrap">Route
    <select id="route" title="Choose how this message reaches Claude">
      <option value="protected">🛡 Via AI Defense</option>
      <option value="direct">⚠ Direct to Claude (no AI Defense)</option>
    </select>
  </label>
</header>
<main>
  <section id="chat"></section>
  <aside id="log"><strong>AI Defense verdicts</strong><p class="muted">Each turn shows what AI Defense decided.</p></aside>
</main>
<form id="composer">
  <div id="pending"></div>
  <div id="row">
    <input type="file" id="picker" multiple hidden>
    <button type="button" class="act secondary" id="attach" title="Attach files (or drag &amp; drop anywhere on this page, or paste)">📎</button>
    <textarea id="q" placeholder="Ask something... attach files with 📎, drag &amp; drop them anywhere, or paste an image (try a prompt injection hidden in a file)"></textarea>
    <button type="submit" class="act" id="send">Send</button>
    <button type="button" class="act secondary" id="reset">Reset</button>
  </div>
  <div id="err"></div>
</form>
<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), logEl = $('log'), q = $('q'), f = $('composer'), pendingEl = $('pending'), errEl = $('err');
let history = [];      // {role, content, attachments:[{name, data, mime}]}
let pending = [];      // files chosen for the next message
let info = {limits: {max_file_bytes: 5242880, max_files_per_message: 5, max_total_attachment_bytes: 20971520}};

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const mb = n => n < 1024 ? n + ' B' : n < 1048576 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
function setErr(m) { errEl.textContent = m || ''; }

fetch('/api/info').then(r => r.json()).then(i => {
  info = i;
  $('ver').textContent = 'v' + i.version;
  $('mode').textContent = 'AI Defense: ' + i.aidefense_mode;
  $('flow').textContent = i.aidefense_mode === 'gateway'
    ? 'App → LiteLLM → Cisco AI Defense gateway → Claude'
    : 'App → Cisco AI Defense (API) → LiteLLM → Claude';
  if (i.allow_direct) {
    $('routeWrap').style.display = 'flex';
    try { const r = localStorage.getItem('labbot-route'); if (r === 'direct' || r === 'protected') $('route').value = r; } catch (e) {}
    styleRoute();
  }
});
function styleRoute() { $('route').classList.toggle('direct', $('route').value === 'direct'); }
$('route').addEventListener('change', () => { styleRoute(); try { localStorage.setItem('labbot-route', $('route').value); } catch (e) {} });

// ---------- attachments ----------
const toB64 = file => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(',')[1] || '');
  r.onerror = () => rej(new Error('Could not read ' + file.name));
  r.readAsDataURL(file);
});
const historyBytes = () => history.reduce((n, m) => n + (m.attachments || []).reduce((a, x) => a + x.size, 0), 0);

async function addFiles(fileList) {
  setErr('');
  const L = info.limits;
  for (const file of fileList) {
    if (pending.length >= L.max_files_per_message) { setErr('At most ' + L.max_files_per_message + ' files per message.'); break; }
    if (file.size > L.max_file_bytes) { setErr(file.name + ' is too large (max ' + mb(L.max_file_bytes) + ').'); continue; }
    const used = historyBytes() + pending.reduce((a, x) => a + x.size, 0);
    if (used + file.size > L.max_total_attachment_bytes) { setErr('Attachments in this chat would exceed ' + mb(L.max_total_attachment_bytes) + '. Click Reset to start a new chat.'); break; }
    try {
      pending.push({name: file.name || 'pasted-image.png', size: file.size, mime: file.type, data: await toB64(file)});
    } catch (e) { setErr(e.message); }
  }
  renderPending();
}
function chip(a, removable, idx) {
  const d = document.createElement('div'); d.className = 'file';
  if (a.mime && a.mime.startsWith('image/') && /^(image\/(png|jpeg|gif|webp))$/.test(a.mime)) {
    const im = document.createElement('img'); im.src = 'data:' + a.mime + ';base64,' + a.data; im.alt = ''; d.appendChild(im);
  } else { const ic = document.createElement('span'); ic.textContent = '📄'; d.appendChild(ic); }
  const nm = document.createElement('span'); nm.textContent = a.name + ' (' + mb(a.size) + ')'; d.appendChild(nm);
  if (removable) {
    const x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.title = 'Remove';
    x.onclick = () => { pending.splice(idx, 1); renderPending(); }; d.appendChild(x);
  }
  return d;
}
function renderPending() { pendingEl.innerHTML = ''; pending.forEach((a, i) => pendingEl.appendChild(chip(a, true, i))); }

$('attach').onclick = () => $('picker').click();
$('picker').onchange = async e => { await addFiles([...e.target.files]); e.target.value = ''; };
// Drag & drop anywhere on the page, and paste from anywhere (a dropped file must never make the browser open it)
const dz = $('dropzone'); let dragDepth = 0;
const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; dz.classList.add('show'); });
window.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) dz.classList.remove('show'); });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; dz.classList.remove('show');
  const dt = e.dataTransfer, files = []; let folders = 0;
  for (const it of [...(dt.items || [])]) {                 // must be read synchronously, inside the event
    if (it.kind !== 'file') continue;
    const entry = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
    if (entry && entry.isDirectory) { folders++; continue; }
    const f = it.getAsFile(); if (f) files.push(f);
  }
  if (!(dt.items && dt.items.length)) files.push(...dt.files);
  addFiles(files);
  if (folders) setErr('Folders cannot be attached. Zip the folder and attach the .zip instead.');
});
window.addEventListener('paste', e => {
  const files = [...((e.clipboardData && e.clipboardData.files) || [])];
  if (!files.length) return;                                // plain text paste: leave to the browser
  e.preventDefault();
  addFiles(files.map(f => /^image\.\w+$/i.test(f.name)
    ? new File([f], 'pasted-image-' + Date.now() + '.' + (f.type.split('/')[1] || 'png'), {type: f.type}) : f));
});

// ---------- chat ----------
function bubble(text, cls, attachments) {
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  if (attachments && attachments.length) {
    const w = document.createElement('div'); w.className = 'files';
    attachments.forEach(a => w.appendChild(chip(a, false)));
    d.appendChild(w);
  }
  const t = document.createElement('div'); t.textContent = text; d.appendChild(t);
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return t;
}

function verdict(v) {
  if (!v) return '<span class="muted">not inspected</span>';
  if (v.error) return `<span class="warn">ERROR</span> <span class="muted">${esc(v.error)}</span>`;
  if (!v.inspected) return '<span class="muted">bypassed (mode=off)</span>';
  const s = v.is_safe ? '<span class="ok">SAFE</span>' : '<span class="bad">UNSAFE</span>';
  const extra = [v.action && 'action=' + v.action,
                 v.classifications.length && 'class=' + v.classifications.join(','),
                 v.rules.length && 'rules=' + v.rules.join(',')].filter(Boolean).join(' · ');
  return `${s}${v.blocked ? ' <span class="bad">(BLOCKED)</span>' : ''} <span class="muted">${esc(extra)}</span>`;
}

f.addEventListener('submit', async e => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text && !pending.length) return;
  setErr('');
  const route = info.allow_direct ? $('route').value : 'protected';
  const atts = pending; pending = []; renderPending(); q.value = '';
  const userBubble = bubble(text || '(files only)', 'user', atts);
  history.push({role: 'user', content: text, attachments: atts, route});
  const out = bubble('…', 'bot');
  $('send').disabled = true;
  try {
    const payload = history.map(m => ({role: m.role, content: m.content,
                                       attachments: (m.attachments || []).map(a => ({name: a.name, data: a.data}))}));
    const r = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                        body: JSON.stringify({messages: payload, route})});
    let data = {}; try { data = await r.json(); } catch (_) {}
    if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail
                               : (data.detail ? 'Invalid request' : 'HTTP ' + r.status));
    out.textContent = data.reply;
    if (data.blocked) { out.parentElement.classList.add('blocked'); history.pop(); }
    else history.push({role: 'assistant', content: data.reply});

    const c = document.createElement('div'); c.className = 'card';
    const gv = data.gateway_verdict, direct = data.route === 'direct';
    const routeLine = direct ? '<div class="warn">Route: DIRECT to Claude, AI Defense bypassed</div>'
                             : '<div class="muted">Route: via AI Defense</div>';
    let body;
    if (direct) body = '<div class="muted">No AI Defense inspection on this message.</div>';
    else if (data.mode === 'gateway') body = gv
      ? `<div>Gateway: <span class="bad">BLOCKED (${esc(gv.stage)})</span></div>
         <div class="muted">rules: ${esc(gv.rules.join(', ') || 'n/a')}</div>
         <div class="muted">${esc(gv.verdict)}</div>`
      : '<div>Gateway: <span class="ok">ALLOWED</span> <span class="muted">inspected inline by AI Defense</span></div>';
    else body = `<div>Prompt: ${verdict(data.prompt_inspection)}</div><div>Response: ${verdict(data.response_inspection)}</div>`;
    const hint = (data.blocked && !direct && history.some(m => m.route === 'direct'))
      ? '<div class="warn">Hint: earlier messages in this chat were sent via Direct. They are inspected again now and may be what AI Defense blocked. Click Reset to start clean.</div>' : '';
    const fl = (data.files || []).map(x => `<div class="muted">📎 ${esc(x.name)} · ${esc(x.kind)}${x.pages ? ' · ' + x.pages + ' pages' : ''}${x.entries != null ? ' · ' + x.entries + ' entries, ' + x.read + ' read, ' + x.skipped + ' skipped' : ''}${x.chars ? ' · ' + x.chars + ' chars read' : ''}${x.truncated ? ' · truncated' : ''}</div>`
      + (x.notes || []).map(n => `<div class="muted notes">– ${esc(n)}</div>`).join('')).join('');
    c.innerHTML = `<div class="muted">${esc((text || '(files only)').slice(0, 60))}</div>${routeLine}${fl}${body}${hint}
                   <div class="muted">id ${esc(data.request_id.slice(0, 8))}</div>`;
    logEl.appendChild(c); logEl.scrollTop = logEl.scrollHeight;
  } catch (err) {
    // not a security verdict: remove this turn, put the message and files back, and say what went wrong
    out.parentElement.remove(); userBubble.parentElement.remove(); history.pop();
    q.value = text; pending = atts; renderPending(); setErr(err.message);
  } finally { $('send').disabled = false; }
});
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });
$('reset').onclick = () => { history = []; pending = []; renderPending(); chat.innerHTML = ''; setErr(''); };
</script>
</body>
</html>
