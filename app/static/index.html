<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabBot - AI Defense Lab</title>
<style>
  :root { --bg:#0f172a; --panel:#111827; --line:#1f2937; --text:#e5e7eb; --muted:#9ca3af;
          --user:#1d4ed8; --bot:#1f2937; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  .pill { font-size:12px; padding:2px 8px; border-radius:999px; background:var(--line); color:var(--muted); }
  .flow { font-size:12px; color:var(--muted); }
  main { flex:1; display:flex; min-height:0; }
  #chat { flex:2; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  #log { flex:1; overflow-y:auto; padding:16px; border-left:1px solid var(--line); background:var(--panel); font-size:13px; }
  .msg { max-width:80%; padding:10px 12px; border-radius:10px; white-space:pre-wrap; line-height:1.4; }
  .user { align-self:flex-end; background:var(--user); }
  .bot { align-self:flex-start; background:var(--bot); }
  .blocked { border:1px solid var(--bad); background:#3f1d1d; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; height:60px; background:var(--panel); color:var(--text);
             border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
  button { background:var(--user); color:white; border:0; border-radius:8px; padding:0 16px; cursor:pointer; font:inherit; }
  button.secondary { background:var(--line); }
  .card { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .muted { color:var(--muted); }
  @media (max-width: 800px) { main { flex-direction:column; } #log { border-left:0; border-top:1px solid var(--line); max-height:35vh; } }
</style>
</head>
<body>
<header>
  <h1>LabBot</h1>
  <span class="pill" id="ver">v?</span>
  <span class="pill" id="mode">AI Defense: ?</span>
  <span class="flow" id="flow"></span>
</header>
<main>
  <section id="chat"></section>
  <aside id="log"><strong>AI Defense verdicts</strong><p class="muted">Each turn shows what AI Defense decided.</p></aside>
</main>
<form id="f">
  <textarea id="q" placeholder="Ask something... (try a prompt injection to test AI Defense)"></textarea>
  <button type="submit">Send</button>
  <button type="button" class="secondary" id="reset">Reset</button>
</form>
<script>
const chat = document.getElementById('chat'), logEl = document.getElementById('log');
const q = document.getElementById('q'), f = document.getElementById('f');
let history = [];

fetch('/api/info').then(r => r.json()).then(i => {
  document.getElementById('ver').textContent = 'v' + i.version;
  document.getElementById('mode').textContent = 'AI Defense: ' + i.aidefense_mode;
  document.getElementById('flow').textContent = i.aidefense_mode === 'gateway'
    ? 'App → LiteLLM → Cisco AI Defense gateway → Claude'
    : 'App → Cisco AI Defense (API) → LiteLLM → Claude';
});

function bubble(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}

function verdict(v) {
  if (!v) return '<span class="muted">not inspected</span>';
  if (v.error) return `<span class="warn">ERROR</span> <span class="muted">${esc(v.error)}</span>`;
  if (!v.inspected) return '<span class="muted">bypassed (mode=off)</span>';
  const s = v.is_safe ? '<span class="ok">SAFE</span>' : '<span class="bad">UNSAFE</span>';
  const extra = [v.action && 'action=' + v.action,
                 v.classifications.length && 'class=' + v.classifications.join(','),
                 v.rules.length && 'rules=' + v.rules.join(',')].filter(Boolean).join(' · ');
  return `${s}${v.blocked ? ' <span class="bad">(BLOCKED)</span>' : ''} <span class="muted">${esc(extra)}</span>`;
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

f.addEventListener('submit', async e => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  q.value = ''; bubble(text, 'user');
  history.push({role: 'user', content: text});
  const pending = bubble('…', 'bot');
  try {
    const r = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                        body: JSON.stringify({messages: history})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    pending.textContent = data.reply;
    if (data.blocked) {
      pending.classList.add('blocked');
      history.pop();               // drop the blocked user turn so the conversation stays clean
    } else {
      history.push({role: 'assistant', content: data.reply});
    }
    const c = document.createElement('div'); c.className = 'card';
    const body = data.mode === 'gateway'
      ? `<div>Gateway: ${data.blocked ? '<span class="bad">BLOCKED</span>' : '<span class="ok">ALLOWED</span>'}
           <span class="muted">${esc(data.gateway_error || 'inspected inline by AI Defense gateway')}</span></div>`
      : `<div>Prompt: ${verdict(data.prompt_inspection)}</div>
         <div>Response: ${verdict(data.response_inspection)}</div>`;
    c.innerHTML = `<div class="muted">${esc(text.slice(0, 60))}</div>${body}
                   <div class="muted">id ${data.request_id.slice(0, 8)}</div>`;
    logEl.appendChild(c); logEl.scrollTop = logEl.scrollHeight;
  } catch (err) {
    pending.textContent = 'Error: ' + err.message; pending.classList.add('blocked'); history.pop();
  }
});
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });
document.getElementById('reset').onclick = () => { history = []; chat.innerHTML = ''; };
</script>
</body>
</html>
