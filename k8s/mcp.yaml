# MCP server with MOCK tools for the agent (knowledge base, customers, email, calculator). Same image as LabBot,
# different command. All data is fake. It is only reachable inside the cluster (ClusterIP): LabBot is its only client.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: labbot-mcp
  labels: {app: labbot-mcp}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: labbot-mcp}
  template:
    metadata:
      labels: {app: labbot-mcp}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: mcp
          image: ghcr.io/togarhugo/cisco-ai-defense-lab   # tag is set by kustomization.yaml
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "mcp_server"]
          ports:
            - containerPort: 8000
          env:
            - name: MCP_PORT
              value: "8000"
            # "true" adds a currency_rates tool whose DESCRIPTION hides an instruction (tool poisoning demo)
            - name: MCP_POISONED_TOOL
              valueFrom: {configMapKeyRef: {name: labbot-config, key: MCP_POISONED_TOOL}}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: labbot-mcp
spec:
  selector: {app: labbot-mcp}
  ports:
    - port: 8000
      targetPort: 8000
