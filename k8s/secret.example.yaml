# DO NOT commit real values. Prefer creating the secret with kubectl (see README step 5).
apiVersion: v1
kind: Secret
metadata:
  name: lab-secrets
  namespace: ai-defense-lab
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-..."
  LITELLM_MASTER_KEY: "sk-litellm-change-me"
  AIDEFENSE_GATEWAY_URL: "https://gateway.aidefense.cisco.com/<tenant>/connections/<connection>"
  AIDEFENSE_API_KEY: ""   # only for API mode
  # LITELLM_DB_PASSWORD, LITELLM_SALT_KEY and UI_PASSWORD (LiteLLM admin UI) are added automatically
  # by ./scripts/deploy.sh (scripts/ensure-secrets.sh); you do not need to create them.
