# LiteLLM AI gateway config. Aliases (LabBot picks one with LLM_MODEL in labbot-config.yaml):
#   claude-haiku         Haiku 5.5 via Cisco AI Defense GATEWAY  (cheapest)  <- LabBot chat default
#   claude-agent         Haiku 5.5 via the AI Defense gateway connection of the AGENT (own connection, own Events)
#   claude-chat          Opus 5.5  via Cisco AI Defense GATEWAY  (most capable)
#   claude-haiku-direct  Haiku 5.5 straight to api.anthropic.com (UNPROTECTED baseline)
#   claude-direct        Opus 5.5  straight to api.anthropic.com (UNPROTECTED baseline)
# LiteLLM appends /v1/messages to api_base, so AIDEFENSE_GATEWAY_URL is the connection URL
# exactly as shown in the AI Defense dashboard, e.g.
#   https://gateway.aidefense.cisco.com/<tenant-id>/connections/<connection-id>
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      - model_name: claude-haiku
        litellm_params:
          model: anthropic/claude-haiku-5-5
          input_cost_per_token: 1.0e-7     # Haiku 5.5: $0.10 / 1M input tokens
          output_cost_per_token: 5.0e-7    # $0.50 / 1M output tokens
          api_base: os.environ/AIDEFENSE_GATEWAY_URL
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: claude-agent
        litellm_params:
          model: anthropic/claude-haiku-5-5
          input_cost_per_token: 1.0e-7
          output_cost_per_token: 5.0e-7
          api_base: os.environ/AIDEFENSE_AGENT_GATEWAY_URL   # same URL as claude-haiku until you create a dedicated connection
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: claude-haiku-direct
        litellm_params:
          model: anthropic/claude-haiku-5-5
          input_cost_per_token: 1.0e-7     # Haiku 5.5: $0.10 / 1M input tokens
          output_cost_per_token: 5.0e-7    # $0.50 / 1M output tokens
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: claude-chat
        litellm_params:
          model: anthropic/claude-opus-5-5
          input_cost_per_token: 4.0e-6     # Opus 5.5: $4 / 1M input tokens
          output_cost_per_token: 2.0e-5    # $20 / 1M output tokens
          api_base: os.environ/AIDEFENSE_GATEWAY_URL
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: claude-direct
        litellm_params:
          model: anthropic/claude-opus-5-5
          input_cost_per_token: 4.0e-6     # Opus 5.5: $4 / 1M input tokens
          output_cost_per_token: 2.0e-5    # $20 / 1M output tokens
          api_key: os.environ/ANTHROPIC_API_KEY
    litellm_settings:
      drop_params: true
      request_timeout: 120
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
