# LiteLLM AI gateway config.
#   claude-chat   -> through the Cisco AI Defense GATEWAY (protected)  <- LabBot default
#   claude-direct -> straight to api.anthropic.com (UNPROTECTED baseline for comparison)
# LiteLLM appends /v1/messages to api_base, so AIDEFENSE_GATEWAY_URL is the connection URL
# exactly as shown in the AI Defense dashboard, e.g.
#   https://gateway.aidefense.cisco.com/<tenant-id>/connections/<connection-id>
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      - model_name: claude-chat
        litellm_params:
          model: anthropic/claude-opus-5-5
          api_base: os.environ/AIDEFENSE_GATEWAY_URL
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: claude-direct
        litellm_params:
          model: anthropic/claude-opus-5-5
          api_key: os.environ/ANTHROPIC_API_KEY
    litellm_settings:
      drop_params: true
      request_timeout: 120
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
