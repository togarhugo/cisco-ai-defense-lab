apiVersion: v1
kind: ConfigMap
metadata:
  name: labbot-config
data:
  # gateway  = AI Defense gateway mode (inline, configured in LiteLLM)          <- default
  # enforce  = AI Defense API mode, block      | monitor = API mode, never block
  # off      = no AI Defense from the app (use with LLM_MODEL=claude-direct for a baseline)
  AIDEFENSE_MODE: "gateway"

  # LiteLLM alias (see litellm-config.yaml):
  #   claude-haiku (cheapest, via AI Defense) | claude-chat (Opus, via AI Defense)
  #   claude-haiku-direct / claude-direct     (UNPROTECTED baselines)
  LLM_BASE_URL: "http://litellm:4000"
  LLM_MODEL: "claude-haiku"
  # The chat UI lets the user pick per message: protected (LLM_MODEL, through AI Defense) or
  # direct (LLM_MODEL_DIRECT, straight to Claude, AI Defense bypassed). Set ALLOW_DIRECT_ROUTE to
  # "false" to remove the direct option.
  LLM_MODEL_DIRECT: "claude-haiku-direct"
  ALLOW_DIRECT_ROUTE: "true"

  # File / image uploads
  MAX_FILE_BYTES: "5242880"                 # 5 MB per file
  MAX_FILES_PER_MESSAGE: "5"
  MAX_TOTAL_ATTACHMENT_BYTES: "20971520"    # 20 MB of attachments per chat
  MAX_FILE_TEXT_CHARS: "100000"             # text extracted from a file is cut after this
  LLM_MAX_TOKENS: "16000"

  # Gateway mode: AI Defense returns blocks as HTTP 200 text like
  # "This request violates rules: Prompt Injection". Leave unset to use the built-in pattern.
  # AIDEFENSE_GATEWAY_BLOCK_PATTERN: '^\s*This (?P<stage>request|response|prompt) violates (?:the following )?rules?\s*:\s*(?P<rules>.+?)\s*\.?\s*$'

  # --- API mode only (ignored in gateway mode) ---
  AIDEFENSE_BASE_URL: "https://us.api.inspect.aidefense.security.cisco.com"
  AIDEFENSE_CHAT_PATH: "/api/v1/inspect/chat"
  AIDEFENSE_FAIL_OPEN: "false"
  AIDEFENSE_INSPECT_RESPONSE: "true"
